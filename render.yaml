services:
  - type: web
    name: civil-erp
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civil-erp-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: ./uploads
      - key: NODE_VERSION
        value: 22.11.0

databases:
  - name: civil-erp-db
    plan: basic-256mb
